name: ${COMPOSE_PROJECT_NAME}
services:
  db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: wger
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wger -d wger']
      interval: 5s
      timeout: 5s
      retries: 30

  cache:
    image: redis:7.4.8-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: &wger-image wger/server@sha256:6dccc74fb23f185903895f430db11e0f714e43a35c9299df61bfc97b22e456cc
    environment: &wger-env
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      DJANGO_DB_DATABASE: wger
      DJANGO_DB_USER: wger
      DJANGO_DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: '5432'
      SECRET_KEY: ${SECRET_KEY}
      SITE_URL: ${PUBLIC_URL}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_URL}
      TIME_ZONE: UTC
      TZ: UTC
      DJANGO_DEBUG: 'False'
      WGER_USE_GUNICORN: 'True'
      DJANGO_PERFORM_MIGRATIONS: 'True'
      DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
      DJANGO_CACHE_LOCATION: redis://cache:6379/1
      DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
      USE_CELERY: 'True'
      CELERY_BROKER: redis://cache:6379/2
      CELERY_BACKEND: redis://cache:6379/2
      SYNC_EXERCISES_ON_STARTUP: 'False'
      SYNC_EXERCISES_CELERY: 'False'
      SYNC_EXERCISE_IMAGES_CELERY: 'False'
      SYNC_EXERCISE_VIDEOS_CELERY: 'False'
      SYNC_INGREDIENTS_CELERY: 'False'
      LOAD_ONLINE_FIXTURES_ON_STARTUP: 'False'
      DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP: 'False'
      DOWNLOAD_INGREDIENTS_FROM: None
      AXES_ENABLED: 'False'
      ALLOW_REGISTRATION: 'True'
      ALLOW_GUEST_USERS: 'False'
      GUNICORN_CMD_ARGS: --workers 2 --threads 2 --timeout 240
      DEMO_USERNAME: ${DEMO_USERNAME}
      DEMO_EMAIL: ${DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      SEED_END_DATE: ${SEED_END_DATE:-}
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/version/', timeout=10)"]
      interval: 5s
      timeout: 15s
      start_period: 180s
      retries: 60

  worker:
    image: *wger-image
    command: /start-worker
    environment: *wger-env
    volumes: [media:/home/wger/media]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, celery, -A, wger, inspect, ping, --timeout, '5']
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10

  frontend:
    image: nginx:1.28.2-alpine
    ports: ['127.0.0.1:${APP_PORT}:80']
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/wger/static:ro
      - media:/wger/media:ro
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/api/v2/version/']
      interval: 5s
      timeout: 10s
      retries: 30

  seed:
    image: *wger-image
    profiles: [tools]
    environment: *wger-env
    entrypoint: [python3, manage.py, shell, -c, "exec(open('/harness/seed.py').read())"]
    volumes:
      - ./scripts:/harness:ro
      - ./runtime:/runtime
    depends_on:
      web: {condition: service_healthy}


  example-addon:
    image: python:3.12.13-alpine
    profiles: [addon]
    working_dir: /harness/scripts
    command: [python, addon.py]
    environment: &runner-env
      TARGET: wger
      APP_URL: http://web:8000
      PUBLIC_URL: ${PUBLIC_URL}
      PYTHONPATH: /harness/scripts
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ./scripts:/harness/scripts:ro
      - ./runtime:/runtime:ro
    ports:
      - '127.0.0.1:${ADDON_PORT}:8080'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=10)"]
      interval: 5s
      timeout: 15s
      retries: 12

  test:
    image: python:3.12.13-alpine
    profiles: [tools]
    environment: *runner-env
    command: [python, /harness/tests/test_harness.py]
    volumes:
      - ./scripts:/harness/scripts:ro
      - ./tests:/harness/tests:ro
      - ./runtime:/runtime:ro
      - ./reports:/reports

volumes:
  database:
  static:
  media:
