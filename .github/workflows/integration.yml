name: Integration
on: [push, pull_request, workflow_dispatch]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python harness.py test
      - if: failure()
        run: docker compose --profile '*' logs --no-color > reports/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: reports/
      - if: always()
        run: python harness.py down
